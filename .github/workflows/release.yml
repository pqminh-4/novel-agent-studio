name: Release Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag đã tồn tại cần phát hành (ví dụ: v0.1.6)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify, package and publish
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag
        run: pnpm release:verify-tag -- $env:RELEASE_TAG

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Verify coverage thresholds
        run: pnpm test:coverage

      - name: Build and publish updater artifacts
        run: pnpm release:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM and checksums
        run: pnpm release:metadata

      - name: Attach release metadata
        shell: bash
        run: >-
          gh release upload "$RELEASE_TAG"
          "release/novel-agent-studio-${RELEASE_TAG#v}.sbom.cdx.json"
          "release/SHA256SUMS.txt"
          --repo "$GITHUB_REPOSITORY"
          --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
